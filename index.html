    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .pdf-list {
            margin-top: 20px;

        .pdf-item {
            margin-bottom: 15px;
        }
        .pdf-item a {
            text-decoration: none;
            color: #1a73e8;
            font-weight: bold;
        }
        .pdf-item a:hover {
            text-decoration: underline;
        }

            border: 1px solid #ccc;
            width: 100%;
            height: 600px;
        }

</head>

            <a href="files/Advance Database Webdevlopment Slips Solution_111.pdf" target="pdfViewer">Sample PDF 1</a>

    </div>

    <iframe name="pdfViewer" class="pdf-viewer"></iframe>
