        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PDF Library</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    background-color: #f5f5f5;
                    padding: 20px;
                }

                h1 {
                    color: #333;
                }

                .pdf-list {
                    margin-top: 20px;
                }

                .pdf-item {
                    margin-bottom: 15px;
                }

                .pdf-item a {
                    text-decoration: none;
                    color: #1a73e8;
                    font-weight: bold;
                }

                .pdf-item a:hover {
                    text-decoration: underline;
                }

                .pdf-viewer {
                    margin-top: 40px;
                    border: 1px solid #ccc;
                    width: 100%;
                    height: 600px;
                }
            </style>
        </head>

            <iframe name="pdfViewer" class="pdf-viewer"></iframe>
        </body>

        </html>
